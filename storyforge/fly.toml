# fly launch --config fly.toml  (from storyforge/)
# Docs: authorforge/docs/HYBRID_DEPLOY.md (shared hybrid pattern)

app = "scanlogic-storyforge"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  STORYFORGE_SERVE_STATIC = "1"
  STORYFORGE_IMAGE_PROVIDER = "mock"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
