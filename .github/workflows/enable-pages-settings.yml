# Run once from Actions → "Enable Pages (API)" → Run workflow
# Tries to point Pages at gh-pages; may fail without repo admin — then use Settings UI (link in summary).

name: Enable Pages (API)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Set Pages source to gh-pages
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" --input - <<<"$BODY"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" --input - <<<"$BODY"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instructions
        run: |
          {
            echo "## Enable GitHub Pages"
            if [[ "${{ steps.pages.outputs.enabled }}" == "true" ]]; then
              echo "Pages API configured. Site: https://codebwoy.github.io/aridscanlogic/"
            else
              echo "API could not enable Pages (needs repo admin or manual step)."
              echo ""
              echo "**Do this manually (30 seconds):**"
              echo "1. [Pages settings](https://github.com/codebwoy/aridscanlogic/settings/pages)"
              echo "2. **Deploy from a branch** → **gh-pages** → **/(root)** → **Save**"
              echo "3. [Actions permissions](https://github.com/codebwoy/aridscanlogic/settings/actions) → **Read and write**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger site deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy GitHub Pages" --repo "${{ github.repository }}" --ref main
