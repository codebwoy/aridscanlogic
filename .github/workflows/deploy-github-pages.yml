# Builds dist/ and publishes to gh-pages.
# Enable Pages once in repo Settings → Pages → gh-pages / (root).
# GITHUB_TOKEN cannot enable Pages via API on template repos (403).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - name: SPA fallback (404 → index.html)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Deploy summary
        run: |
          {
            echo "## GitHub Pages deploy"
            echo ""
            echo "Build published to \`gh-pages\`."
            echo ""
            echo "Live site: https://codebwoy.github.io/aridscanlogic/"
            echo ""
            echo "If the site is **404**, enable Pages once:"
            echo "1. [Pages settings](https://github.com/${{ github.repository }}/settings/pages)"
            echo "2. **Deploy from a branch** → **\`gh-pages\`** → **\`/(root)\`** → **Save**"
          } >> "$GITHUB_STEP_SUMMARY"
