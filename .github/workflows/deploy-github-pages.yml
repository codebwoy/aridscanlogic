# ✅ Current deploy workflow (peaceiris → gh-pages branch)
# ❌ Do NOT re-run failed workflow #1 — it used actions/deploy-pages@v4 from an old commit and will always 404.
#    Open the latest run of THIS workflow, or use "Setup GitHub Pages (run once)".

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Workflow info
        run: |
          echo "This run uses peaceiris (gh-pages branch), NOT actions/deploy-pages."
          echo "If your log shows deploy-pages@v4, you re-ran obsolete workflow #1 — stop that run."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable Pages (gh-pages / root)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF' || true
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF

      - name: Done
        run: |
          echo "Site (1-2 min): https://codebwoy.github.io/aridscanlogic/"
          echo "If blank, open Settings → Pages → gh-pages branch → / (root)"
