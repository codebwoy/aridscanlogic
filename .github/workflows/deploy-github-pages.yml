# Builds dist/ and publishes to gh-pages. GitHub Pages must be enabled once in repo
# Settings (GITHUB_TOKEN cannot do the first enablement on template repos).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - name: SPA fallback (404 → index.html)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Try enable Pages (gh-pages source)
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${AUTH[@]}" "$API")
          if [ "$CODE" = "404" ]; then
            CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${AUTH[@]}" -d "$BODY" "$API")
          elif [ "$CODE" = "200" ]; then
            CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${AUTH[@]}" -d "$BODY" "$API")
          fi
          cat /tmp/pages.json || true
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy summary
        run: |
          {
            echo "## GitHub Pages deploy"
            echo ""
            echo "Build published to \`gh-pages\`."
            if [ "${{ steps.pages.outputs.enabled }}" = "true" ]; then
              echo "Pages source updated. Site: https://codebwoy.github.io/aridscanlogic/"
            else
              echo "**One-time setup (if the site is 404):**"
              echo "1. [Pages settings](https://github.com/${{ github.repository }}/settings/pages)"
              echo "2. **Deploy from a branch** → branch **\`gh-pages\`** → folder **\`/(root)\`** → **Save**"
              echo "3. Wait ~1 min, then open https://codebwoy.github.io/aridscanlogic/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
