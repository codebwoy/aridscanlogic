# GitHub Pages — official Actions deploy (build + deploy jobs).
# Do NOT re-run failed workflow #1 (commit bd95397) — use the latest run or workflow_dispatch.
#
# If deploy still 404s: Settings → Pages → Source: "GitHub Actions"
# https://github.com/codebwoy/aridscanlogic/settings/pages

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages (Actions source)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow 2>/dev/null || \
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow 2>/dev/null || true
          echo "If deploy fails with 404, open:"
          echo "https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "Set Source to: GitHub Actions"

  build:
    needs: enable-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
