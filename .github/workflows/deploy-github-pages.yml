# GitHub Pages — official Actions deployment (build → deploy).
# Requires Pages enabled with source "GitHub Actions" (configure-pages enablement: true attempts this).
#
# Do NOT re-run obsolete workflow #1 (commit bd95397) — use the latest run after pushing to main.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - name: SPA fallback (404 → index.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: success()
        run: |
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Also: https://codebwoy.github.io/aridscanlogic/" >> "$GITHUB_STEP_SUMMARY"
