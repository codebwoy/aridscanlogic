# Builds dist/ and pushes to gh-pages. Tries to enable Pages via API (pages: write).
# If the site stays 404, set source once: Settings → Pages → gh-pages / (root).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - name: SPA fallback (404 → index.html)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable GitHub Pages (gh-pages branch)
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api "repos/${GITHUB_REPOSITORY}/pages" &>/dev/null; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" --input - <<<"$BODY"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" --input - <<<"$BODY"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Deploy summary
        run: |
          {
            echo "## GitHub Pages deploy"
            echo ""
            if [[ "${{ steps.pages.outputs.enabled }}" == "true" ]]; then
              echo "Pages source set to \`gh-pages\` / (root). Site: https://codebwoy.github.io/aridscanlogic/"
            else
              echo "Build is on \`gh-pages\`. If the site is still 404, enable once:"
              echo "1. [Pages settings](https://github.com/${{ github.repository }}/settings/pages)"
              echo "2. **Deploy from a branch** → **gh-pages** → **/(root)** → Save"
              echo "3. [Actions permissions](https://github.com/${{ github.repository }}/settings/actions) → **Read and write**"
              echo ""
              echo "Then open https://codebwoy.github.io/aridscanlogic/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
