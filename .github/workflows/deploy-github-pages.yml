# Deploys by pushing dist/ to the gh-pages branch (peaceiris).
# Does NOT use actions/deploy-pages — that action returns 404 until Pages is set to "GitHub Actions".
#
# One-time: https://github.com/codebwoy/aridscanlogic/settings/pages
#   → Deploy from a branch → gh-pages → / (root)

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - run: cp dist/index.html dist/404.html

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Summary
        run: |
          echo "## Deploy finished" >> "$GITHUB_STEP_SUMMARY"
          echo "No deploy-pages step — site is on the **gh-pages** branch." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. [Pages settings](https://github.com/${{ github.repository }}/settings/pages) → **Deploy from a branch** → **gh-pages** → **/(root)**" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Open https://codebwoy.github.io/aridscanlogic/" >> "$GITHUB_STEP_SUMMARY"
