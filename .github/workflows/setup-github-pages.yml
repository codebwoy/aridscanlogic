# Run this ONCE from the Actions tab → "Setup GitHub Pages (run once)" → Run workflow
# Fixes 404 from old "deploy-pages" runs by publishing to gh-pages and enabling Pages in settings via API.

name: Setup GitHub Pages (run once)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable GitHub Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF' || true
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF
          echo ""
          echo "Done. Site (may take 1-2 min): https://codebwoy.github.io/aridscanlogic/"
          echo "Settings: https://github.com/${GITHUB_REPOSITORY}/settings/pages"
