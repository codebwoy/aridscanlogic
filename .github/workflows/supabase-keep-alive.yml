# Optional backup keep-alive — only runs when CRON_SECRET is in GitHub Actions secrets.
# Primary schedulers: Vercel Cron (vercel.json) + cron-job.org (see DEPLOY.md).
#
# To enable this backup (same secret as Vercel):
#   ./scripts/enable-github-keep-alive.sh
# Or: GitHub → Settings → Secrets and variables → Actions → CRON_SECRET

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ secrets.CRON_SECRET != '' }}
    steps:
      - name: Ping keep-alive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://aridscanlogic-tau.vercel.app/api/cron/keep-alive}"
          curl -sf -H "Authorization: Bearer ${CRON_SECRET}" "$URL"
          echo "Keep-alive OK: $URL"
