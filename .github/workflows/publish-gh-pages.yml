# Publishes dist/ to the gh-pages branch (peaceiris).
# Does NOT use actions/deploy-pages — that action requires Pages "GitHub Actions" source and returns 404 otherwise.
#
# If you see a failed run with "deploy-pages@v4", that is an OLD run (e.g. #1 on commit bd95397).
# Do not click "Re-run" on old runs — open the latest run for this workflow instead.

name: Publish Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SITE_URL: https://codebwoy.github.io/aridscanlogic
          VITE_BASE_PATH: /aridscanlogic/

      - name: SPA fallback (404 → index.html)
        run: cp dist/index.html dist/404.html

      - name: Push dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Enable Pages from gh-pages branch (API)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          EOF
          echo "If this step fails, set Pages manually:"
          echo "https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "Source: Deploy from a branch → gh-pages → / (root)"
